<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joute · Ajouter un ami</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EDEDED;color:#111;font:16px/1.45 -apple-system,system-ui,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:26px;margin:0 0 6px}p{margin:8px 0;opacity:.8}b{opacity:1}.c{display:inline-block;margin-top:10px;padding:8px 14px;border:2px solid #111;border-radius:12px;font:800 18px Helvetica,Arial,sans-serif;letter-spacing:.2em}</style></head>
<body><div><h1 id="t">Ajouter un ami sur Joute</h1>
<p>Pour ajouter ce joueur, ouvre l’app <b>Joute</b> → <b>Réglages</b> → <b>Amis</b> → <b>Scanner un QR code</b>, puis scanne à nouveau son code.</p>
<div class="c" id="c"></div></div>
<script>try{var q=new URLSearchParams(location.search),n=(q.get('n')||'').slice(0,16),c=(q.get('c')||'').replace(/[^A-Z0-9]/gi,'').slice(0,6);if(n)document.getElementById('t').textContent='Ajouter '+n+' sur Joute';if(c)document.getElementById('c').textContent=c;else document.getElementById('c').remove();}catch(e){}</script>
</body></html>
